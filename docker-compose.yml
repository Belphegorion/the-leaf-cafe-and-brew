version: '3.8'

services:
  # 1. MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: the_leaf_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: the_leaf_db
    volumes:
      - mongo_data:/data/db
    networks:
      - leaf_network

  # 2. Redis In-Memory Cache & Booking Slot Locks
  redis:
    image: redis:7.2-alpine
    container_name: the_leaf_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - leaf_network

  # 3. Node.js + Express Backend API & WebSocket Engine
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: the_leaf_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/the_leaf_db
      REDIS_URL: redis://redis:6379
      CLIENT_ORIGIN: http://localhost:5173
      JWT_SECRET: leaf_jwt_production_secret_key_change_in_env
    depends_on:
      - mongodb
      - redis
    networks:
      - leaf_network

  # 4. React 18 + Vite Frontend Application (Served via Nginx in production)
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: the_leaf_client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server
    networks:
      - leaf_network

volumes:
  mongo_data:
  redis_data:

networks:
  leaf_network:
    driver: bridge
